[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-screen"
version = "0.0.0"
description = "Protein mimic screen analysis and auto literature search pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "pandas",
    "requests",
    "loguru",
]

[project.optional-dependencies]
# Stage 1 Slurm jobs (mapping + EPMC search) and local CLI use.
auto-lit = [
    "mygene",
    "lxml",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
